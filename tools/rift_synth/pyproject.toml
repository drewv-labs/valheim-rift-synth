[project]
name = "rift-synth"
version = "0.1.0"
description = "BYO-LLM Mythic+ Skybox Dungeon Synthesizer & Potato-PC Linter for Valheim 1.0.21+"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.5.0",
    "jsonschema>=4.23.0",
    "openai>=1.60.0",
    "pydantic>=2.10.0",
]

[project.scripts]
rift-synth = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "room_catalog.py",
    "validator.py",
    "cli.py",
]
